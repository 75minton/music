<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>75 Minton Music Share</title>
  <meta name="description" content="75민턴 음악 공유 미리보기" />
  <meta property="og:type" content="music.song" />
  <meta property="og:title" content="75 Minton Music" />
  <meta property="og:description" content="75민턴 음악 공유 미리보기" />
  <meta property="og:image" content="https://75minton.github.io/music/icons/icon-512.png" />
  <meta property="og:url" content="https://75minton.github.io/music/share/player.html" />
  <meta name="theme-color" content="#07090d" />
  <style>
    :root {
      --bg: #07090d;
      --panel: rgba(18, 22, 31, 0.9);
      --line: rgba(255, 255, 255, 0.1);
      --text: #f7fafc;
      --sub: #a6b0bd;
      --accent: #7aa7ff;
      --rose: #ff7aa8;
    }

    * { box-sizing: border-box; }

    html,
    body {
      min-height: 100%;
      margin: 0;
      font-family: "Noto Sans KR", "Inter", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 14% 12%, rgba(122, 167, 255, 0.28), transparent 32%),
        radial-gradient(circle at 86% 8%, rgba(255, 122, 168, 0.18), transparent 28%),
        linear-gradient(135deg, #05070a, #0c111a 52%, #10131c);
    }

    body {
      display: grid;
      place-items: center;
      padding: 28px 16px;
    }

    .share-card {
      width: min(920px, 100%);
      display: grid;
      grid-template-columns: minmax(220px, 340px) minmax(0, 1fr);
      gap: 28px;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: var(--panel);
      box-shadow: 0 26px 70px rgba(0, 0, 0, 0.46);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .cover {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 26px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 22px 48px rgba(0, 0, 0, 0.36), 0 0 42px rgba(122, 167, 255, 0.16);
      background: rgba(255, 255, 255, 0.06);
    }

    .kicker {
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 1.03;
      letter-spacing: -0.06em;
    }

    .artist {
      margin-bottom: 22px;
      color: var(--sub);
      font-weight: 800;
    }

    audio {
      width: 100%;
      margin: 12px 0 22px;
      accent-color: var(--accent);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      text-decoration: none;
      font-weight: 900;
      cursor: pointer;
    }

    .btn.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #07090d;
    }

    .status {
      margin-top: 16px;
      color: var(--sub);
      font-size: 0.86rem;
      line-height: 1.5;
    }

    @media (max-width: 720px) {
      body { place-items: start center; }

      .share-card {
        grid-template-columns: 1fr;
        gap: 20px;
        padding: 20px;
        border-radius: 24px;
      }

      .cover {
        width: min(100%, 360px);
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>
  <main class="share-card">
    <img alt="75 Minton cover" class="cover" id="cover" src="../icons/icon-512.png" />
    <section>
      <div class="kicker">75 MINTON MUSIC</div>
      <h1 id="title">곡 정보를 불러오는 중</h1>
      <div class="artist" id="artist">75 Minton</div>
      <audio controls id="audio" preload="metadata"></audio>
      <div class="actions">
        <a class="btn primary" id="openApp" href="../index.html">앱에서 듣기</a>
        <a class="btn" id="download" href="#" download>MP3 다운로드</a>
        <button class="btn" id="shareAgain" type="button">공유하기</button>
      </div>
      <p class="status" id="status">공유 받은 곡을 바로 미리듣기 할 수 있습니다.</p>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const no = Math.max(1, parseInt(params.get('no') || '1', 10) || 1);
    const fallbackSongs = [
      {
        title: '너를 믿는 목소리',
        artist: 'TRINITY - JIWOO',
        cover: '../sound/12.너를 믿는 목소리.png?v=20260621',
        url: '../sound/12.너를 믿는 목소리.mp3?v=20260621'
      },
      {
        title: '우린 함께 간다',
        artist: 'TONY PARK',
        cover: '../sound/13.우린 함께 간다.png?v=20260805',
        url: '../sound/13.우린 함께 간다.mp3?v=20260805'
      }
    ];

    function resolveSongAsset(path, fallback = '../icons/icon-512.png') {
      const raw = String(path || fallback).trim();
      if (!raw) return new URL(fallback, window.location.href).toString();
      if (/^[a-z][a-z\d+.-]*:/i.test(raw) || raw.startsWith('//')) return raw;

      // songs.json은 앱 루트 기준("./sound/...")이고, 이 페이지는 share/ 하위에 있습니다.
      if (raw.startsWith('./')) {
        return new URL(`../${raw.slice(2)}`, window.location.href).toString();
      }

      if (raw.startsWith('sound/') || raw.startsWith('icons/')) {
        return new URL(`../${raw}`, window.location.href).toString();
      }

      return new URL(raw, window.location.href).toString();
    }

    function normalizeSong(song) {
      if (!song) return null;
      return {
        title: song.title || '75 Minton Music',
        artist: song.artist || '75 Minton',
        cover: resolveSongAsset(song.cover, '../icons/icon-512.png'),
        url: resolveSongAsset(song.url, ''),
        downloadName: `${song.title || '75minton-track'}.mp3`
      };
    }

    async function loadSong() {
      try {
        const response = await fetch(`../songs.json?_=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`songs.json ${response.status}`);
        const data = await response.json();
        const list = Array.isArray(data.songs) ? data.songs : [];
        return normalizeSong(list[no - 1]);
      } catch (err) {
        console.warn('songs.json 로딩 실패, 공유 페이지 fallback을 사용합니다.', err);
        if (no === 12) return normalizeSong(fallbackSongs[0]);
        if (no === 13) return normalizeSong(fallbackSongs[1]);
        return null;
      }
    }

    function updateMeta(song) {
      document.title = `${song.title} - 75 Minton Music`;
      document.querySelector('meta[name="description"]').setAttribute('content', `${song.title} - ${song.artist}`);
      document.querySelector('meta[property="og:title"]').setAttribute('content', `${song.title} - ${song.artist}`);
      document.querySelector('meta[property="og:description"]').setAttribute('content', '75민턴 음악 공유 미리보기');
      document.querySelector('meta[property="og:image"]').setAttribute('content', song.cover);
      document.querySelector('meta[property="og:url"]').setAttribute('content', window.location.href);
    }

    async function init() {
      const song = await loadSong();
      const status = document.getElementById('status');

      if (!song || !song.url) {
        status.textContent = '곡 정보를 찾지 못했습니다. 앱에서 전체 목록을 확인해주세요.';
        document.getElementById('openApp').href = `../index.html?no=${encodeURIComponent(no)}`;
        return;
      }

      document.getElementById('cover').src = song.cover;
      document.getElementById('cover').alt = `${song.title} cover`;
      document.getElementById('title').textContent = song.title;
      document.getElementById('artist').textContent = song.artist;
      document.getElementById('audio').src = song.url;
      document.getElementById('openApp').href = `../index.html?no=${encodeURIComponent(no)}`;
      document.getElementById('download').href = song.url;
      document.getElementById('download').download = song.downloadName;
      updateMeta(song);

      document.getElementById('shareAgain').addEventListener('click', async () => {
        const sharePayload = {
          title: `${song.title} - ${song.artist}`,
          text: `75민턴 추천곡: ${song.title}`,
          url: window.location.href
        };

        try {
          if (navigator.share) {
            await navigator.share(sharePayload);
            return;
          }
          await navigator.clipboard.writeText(`${sharePayload.title}\n${sharePayload.url}`);
          status.textContent = '공유 링크를 클립보드에 복사했습니다.';
        } catch (err) {
          if (err?.name === 'AbortError') return;
          window.prompt('공유 링크를 복사하세요.', `${sharePayload.title}\n${sharePayload.url}`);
        }
      });
    }

    init();
  </script>
</body>

</html>
