<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Court Light - Part2</title>
  <meta name="description" content="Court Light - Part2 - TRINITY" />
  <meta name="share-build-version" content="2026-08-09-v1.5-static-share" />
  <meta property="og:type" content="music.song" />
  <meta property="og:title" content="09.Court Light - Part2 - TRINITY" />
  <meta property="og:description" content="75민턴 음악 공유 미리보기" />
  <meta property="og:image" content="https://75minton.github.io/music/sound/09.Court%20Light%20-%20Part2.png?v=20260518" />
  <meta property="og:url" content="https://75minton.github.io/music/share/9.html" />
  <meta property="music:musician" content="TRINITY" />
  <meta property="music:song" content="https://75minton.github.io/music/sound/09.Court%20Light%20-%20Part2.mp3?v=20260518" />
  <meta name="theme-color" content="#07090d" />
  <style>
    :root {
      --bg: #07090d;
      --panel: rgba(18, 22, 31, 0.92);
      --line: rgba(255, 255, 255, 0.1);
      --text: #f7fafc;
      --sub: #a6b0bd;
      --accent: #7aa7ff;
      --rose: #ff7aa8;
    }

    * { box-sizing: border-box; }

    html,
    body {
      min-height: 100%;
      margin: 0;
      font-family: "Noto Sans KR", "Inter", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 14% 12%, rgba(122, 167, 255, 0.28), transparent 32%),
        radial-gradient(circle at 86% 8%, rgba(255, 122, 168, 0.18), transparent 28%),
        linear-gradient(135deg, #05070a, #0c111a 52%, #10131c);
    }

    body {
      display: grid;
      place-items: center;
      padding: 28px 16px;
    }

    .share-card {
      width: min(920px, 100%);
      display: grid;
      grid-template-columns: minmax(220px, 340px) minmax(0, 1fr);
      gap: 28px;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: var(--panel);
      box-shadow: 0 26px 70px rgba(0, 0, 0, 0.46);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .cover {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 26px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 22px 48px rgba(0, 0, 0, 0.36), 0 0 42px rgba(122, 167, 255, 0.16);
      background: rgba(255, 255, 255, 0.06);
    }

    .kicker {
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 1.03;
      letter-spacing: -0.06em;
    }

    .artist {
      margin-bottom: 22px;
      color: var(--sub);
      font-weight: 800;
    }

    audio {
      width: 100%;
      margin: 12px 0 22px;
      accent-color: var(--accent);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      text-decoration: none;
      font-weight: 900;
      cursor: pointer;
    }

    .btn.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #07090d;
    }

    .status {
      margin-top: 16px;
      color: var(--sub);
      font-size: 0.86rem;
      line-height: 1.5;
    }

    @media (max-width: 720px) {
      body { place-items: start center; }

      .share-card {
        grid-template-columns: 1fr;
        gap: 20px;
        padding: 20px;
        border-radius: 24px;
      }

      .cover {
        width: min(100%, 360px);
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>
  <main class="share-card">
    <img alt="Court Light - Part2 cover" class="cover" src="../sound/09.Court Light - Part2.png?v=20260518" />
    <section>
      <div class="kicker">75 MINTON MUSIC</div>
      <h1>Court Light - Part2</h1>
      <div class="artist">TRINITY</div>
      <audio controls preload="metadata" src="../sound/09.Court Light - Part2.mp3?v=20260518"></audio>
      <div class="actions">
        <a class="btn primary" href="../index.html?no=9">앱에서 듣기</a>
        <a class="btn" href="../sound/09.Court Light - Part2.mp3?v=20260518" download="Court Light - Part2.mp3">MP3 다운로드</a>
        <button class="btn" id="shareAgain" type="button">공유하기</button>
      </div>
      <p class="status" id="status">공유 받은 곡을 바로 미리듣기 할 수 있습니다.</p>
    </section>
  </main>

  <script>
    const sharePayload = {
      title: "Court Light - Part2 - TRINITY",
      text: "75민턴 추천곡: Court Light - Part2",
      url: "https://75minton.github.io/music/share/9.html"
    };

    document.getElementById('shareAgain').addEventListener('click', async () => {
      const status = document.getElementById('status');
      try {
        if (navigator.share) {
          await navigator.share(sharePayload);
          return;
        }
        await navigator.clipboard.writeText(`${sharePayload.title}\n${sharePayload.url}`);
        status.textContent = '공유 링크를 클립보드에 복사했습니다.';
      } catch (err) {
        if (err?.name === 'AbortError') return;
        window.prompt('공유 링크를 복사하세요.', `${sharePayload.title}\n${sharePayload.url}`);
      }
    });
  </script>
</body>

</html>
